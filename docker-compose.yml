version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: os2_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-os2admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-os2secret}
      POSTGRES_DB: ${POSTGRES_DB:-os2ems}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-os2admin} -d ${POSTGRES_DB:-os2ems}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: os2_redis
    restart: always
    ports:
      - "6380:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redissecret}
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: os2_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-os2admin}:${POSTGRES_PASSWORD:-os2secret}@postgres:5432/${POSTGRES_DB:-os2ems}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-os2admin}:${POSTGRES_PASSWORD:-os2secret}@postgres:5432/${POSTGRES_DB:-os2ems}
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-this-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      AXIS_BASE_URL: ${AXIS_BASE_URL:-https://apiportal.axisbank.co.in}
      AXIS_CLIENT_ID: ${AXIS_CLIENT_ID:-}
      AXIS_CLIENT_SECRET: ${AXIS_CLIENT_SECRET:-}
      AXIS_CORPORATE_ID: ${AXIS_CORPORATE_ID:-}
      AXIS_ACCOUNT_NUMBER: ${AXIS_ACCOUNT_NUMBER:-9220000000001}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redissecret}@redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:4000,http://localhost:8000}
      SEED_DB: ${SEED_DB:-true}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    image: nginx:alpine
    container_name: os2_frontend
    restart: always
    ports:
      - "4000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
